
name: Build Love Gift EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Для самой особенной" love_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Love-Gift-EXE
          path: dist/*.exe
          if-no-files-found: error
